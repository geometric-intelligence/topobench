_target_: topobench.optimizer.TBOptimizer
# Full compatibility with all available torch optimizers and schedulers

# Upgraded to AdamW: Decouples weight decay to properly penalize dense clique explosions
optimizer_id: AdamW

parameters:
  lr: 0.001
  # Defensive L2 Regularization (Target 3)
  weight_decay: 1e-3

scheduler: # comment or delete these lines to disable scheduler
  scheduler_id: StepLR # torch id of the scheduler. Set to null to disable.
  # scheduler params
  scheduler_params:
    step_size: 50
    gamma: 0.5
