# @package _global_
# Uses the simplicial TRAWL config of the default dataset's domain; pick
# another one with model=<domain>/trawl (e.g. cell/trawl for graph datasets).
defaults:
  - override /model: simplicial/trawl
model:
  backbone:
    num_neighborhoods: 6
transforms:
  trawl:
    neighborhoods: [up_adjacency-0, 2-up_adjacency-0, down_adjacency-1, up_adjacency-1, 2-down_adjacency-2, down_adjacency-2]
