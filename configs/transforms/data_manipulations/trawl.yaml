transform_name: TRAWLTransform
schema_version: 2
transform_type: data_manipulation
max_rank: ${model.backbone.max_rank}
graph: augmented_hasse
# null: up_incidence-r for every r < max_rank (up_adjacency-0 when max_rank
# is 0). The count must match model.backbone.num_neighborhoods.
neighborhoods: null
bidirectional: true
overlap_ranks: null # null: ranks 1..max_rank
encoding_scope: separate
color_key: null
color_refinement: false
# HOPSE positional/structural encodings per relation, plus local degree channels.
encodings:
  local: true
  LapPE:
    max_pe_dim: 8
  RWSE:
    max_pe_dim: 8
  ElectrostaticPE: {}
  HKdiagSE:
    kernel_param_HKdiagSE: [1, 6]
